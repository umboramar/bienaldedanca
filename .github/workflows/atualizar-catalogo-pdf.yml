name: Publicar catalogo reduzido Bienal 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-catalogo-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-catalogo-bienal-2026
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar site existente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar conversores de PDF
        run: python -m pip install --quiet pymupdf Pillow gdown

      - name: Baixar catalogo reduzido do Drive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gdown
          url = "https://drive.google.com/file/d/1Jvvt4f0ok2JyBlMrfAK0K_Awt4_236CI/view?usp=sharing"
          result = gdown.download(url=url, output="catalogo.pdf", fuzzy=True, quiet=False)
          if not result:
              raise SystemExit("Falha ao baixar o catalogo do Drive")
          PY
          echo '8af4d9167bb1f9f0369955821171e0ec3ba0314c9b2c677f7972e05cb1bc2894  catalogo.pdf' | sha256sum --check -

      - name: Incorporar novas 11 paginas mantendo restante do site
        run: python scripts/atualizar_catalogo_pdf_2026.py

      - name: Conferir o HTML e o PDF
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          s=Path("index.html").read_text("utf-8")
          m=re.search(r'<script id="page-data" type="application/json">(.*?)</script>',s,re.S)
          assert m, "page-data ausente"
          d=json.loads(m.group(1))
          assert len(d)==7, list(d)
          assert d["catalogo"].count('class="catalog-page"')==11
          assert 'catalog-ficha-anchor' in d["catalogo"]
          assert "1hFytsu1lK3QkKcZUWrH7uzW41BCECvLa" in s
          assert Path("catalogo.pdf").stat().st_size==9434465
          print("Onze paginas, ficha e botao de imprensa verificados.")
          PY

      - name: Fazer commit e push da atualizacao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html catalogo.pdf
          git commit -m 'Atualizar catalogo Bienal com PDF reduzido e 11 paginas'
          git push origin HEAD:main

      - name: Publicar HTML e PDF na Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/u160128851/bienaldedanca-github
            git fetch origin main
            git reset --hard origin/main
            test -s index.html
            test -s catalogo.pdf
            echo '8af4d9167bb1f9f0369955821171e0ec3ba0314c9b2c677f7972e05cb1bc2894  catalogo.pdf' | sha256sum --check -
            cp catalogo.pdf /home/u160128851/public_html/.catalogo.pdf.tmp
            mv /home/u160128851/public_html/.catalogo.pdf.tmp /home/u160128851/public_html/catalogo.pdf
            cp index.html /home/u160128851/public_html/.index.html.tmp
            mv /home/u160128851/public_html/.index.html.tmp /home/u160128851/public_html/index.html
