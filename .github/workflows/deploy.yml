name: Deploy Bienal

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar site na Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/u160128851/bienaldedanca-github
            git fetch origin main
            git reset --hard origin/main

            test -s index.html
            test -d /home/u160128851/public_html

            sed -i "s|imprensa:''|imprensa:'https://drive.google.com/drive/folders/1hFytsu1lK3QkKcZUWrH7uzW41BCECvLa'|" index.html
            grep -q '1hFytsu1lK3QkKcZUWrH7uzW41BCECvLa' index.html

            cp index.html /home/u160128851/public_html/.index.html.tmp
            mv /home/u160128851/public_html/.index.html.tmp /home/u160128851/public_html/index.html
